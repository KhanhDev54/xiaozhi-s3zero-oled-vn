<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kết nối thành công</title>
<style>
html,body{margin:0;height:100%;background:#0b1020;color:#e7ecf6;font:15px/1.5 -apple-system,"Segoe UI",Roboto,Arial,sans-serif}
body{display:grid;place-items:center;background:radial-gradient(900px 400px at 50% -150px,#1d2a55 0,transparent 70%),#0b1020}
.card{background:#141b2e;border:1px solid #243049;border-radius:18px;padding:28px 22px;max-width:360px;margin:16px;text-align:center}
svg{width:72px;height:72px}
circle{stroke:#34d399;fill:none;stroke-dasharray:166;stroke-dashoffset:166;animation:d .6s ease forwards}
path{stroke:#34d399;stroke-dasharray:48;stroke-dashoffset:48;animation:d .35s .55s ease forwards}
@keyframes d{to{stroke-dashoffset:0}}
h1{font-size:20px;margin:14px 0 6px}
p{color:#93a0b8;margin:6px 0}
</style>
</head>
<body>
<div class="card">
  <svg viewBox="0 0 52 52"><circle cx="26" cy="26" r="25" stroke-width="2"/><path fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" d="M14.1 27.2l7.1 7.2 16.7-16.8"/></svg>
  <h1>Kết nối thành công!</h1>
  <p>Thiết bị đang chuyển sang Wi-Fi nhà bạn.</p>
  <p>Bạn có thể đóng trang này và kết nối điện thoại lại Wi-Fi thường.</p>
</div>
<script>
setTimeout(function(){fetch('/exit',{method:'POST'}).catch(function(){})},1000);
</script>
</body>
</html>
